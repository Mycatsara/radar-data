name: collect
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node collector/collect.js .
      - run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add raw daily status.json
          if git diff --cached --quiet; then echo "변화 없음"; else git commit -m "수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"; git push; fi
