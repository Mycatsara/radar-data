name: archive
on:
  schedule:
    - cron: "30 14 * * *"   # 매일 23:30 KST — 스크립트가 말일인지 판단
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node collector/archive.js
      - run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add monthly yearly 2>/dev/null || true
          if git diff --cached --quiet; then echo "변화 없음"; else git commit -m "월간 집계 $(TZ=Asia/Seoul date '+%Y-%m')"; git push; fi
